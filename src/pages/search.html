<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Movie & TV Explorer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <h1>Movie & TV Explorer</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="search.html">Search</a>
            <a href="favorites.html">Favorites</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Search Movies & TV Shows</h2>

            <form id="search-form">
                <label for="search-input">Search</label>
                <input type="search" id="search-input" name="search" placeholder="Search for a movie or TV show">

                <button type="submit">Search</button>
            </form>
        </section>

        <section>
            <h2 id="search-title">Search Results</h2>

            <div id="search-results">
                <!-- Search results will be displayed here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Movie & TV Explorer</p>
    </footer>

    <script type="module" src="../js/main.js"></script>
</body>

</html>
